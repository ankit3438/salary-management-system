<section class="page">
  <div class="toolbar">
    <div>
      <h1>Employee Management</h1>
      <p>Manage employees and salary records.</p>
    </div>
    <button mat-raised-button color="primary" routerLink="/employees/new">Add Employee</button>
  </div>
  <mat-form-field appearance="outline" class="search"
    ><mat-label>Search employees</mat-label><input matInput [formControl]="search"
  /></mat-form-field>
  <table mat-table [dataSource]="employees">
    <ng-container matColumnDef="employeeCode"
      ><th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let e">{{ e.employeeCode }}</td></ng-container
    ><ng-container matColumnDef="name"
      ><th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let e">{{ e.firstName }} {{ e.lastName }}</td></ng-container
    ><ng-container matColumnDef="email"
      ><th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let e">{{ e.email }}</td></ng-container
    ><ng-container matColumnDef="department"
      ><th mat-header-cell *matHeaderCellDef>Department</th>
      <td mat-cell *matCellDef="let e">{{ e.department }}</td></ng-container
    ><ng-container matColumnDef="designation"
      ><th mat-header-cell *matHeaderCellDef>Designation</th>
      <td mat-cell *matCellDef="let e">{{ e.designation }}</td></ng-container
    ><ng-container matColumnDef="status"
      ><th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let e">{{ e.status }}</td></ng-container
    ><ng-container matColumnDef="actions"
      ><th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let e">
        <button mat-button [routerLink]="['/employees', e.id]">View</button
        ><button mat-button [routerLink]="['/employees', e.id, 'edit']">Edit</button
        ><button mat-button color="warn" (click)="delete(e.id)">Delete</button>
      </td></ng-container
    >
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</section>
